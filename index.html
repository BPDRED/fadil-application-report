<body>

<a class="skip" href="#view">Skip to application</a>

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="back" type="button" aria-label="Back"></button>
    <div class="hd-text"><p class="eyebrow"></p><h1 class="hd-title" id="hdTitle" data-no-translate></h1></div>
    <button class="link" id="language" type="button" aria-pressed="false" aria-label="Switch language"></button>
    <div class="mon" id="mon" role="region" aria-label="Monitoring" data-data-label>
      <div class="mon-row"><span class="ml-mb"></span><b class="mb-date" data-no-translate></b></div>
      <div class="mon-row"><span class="ml-app"></span><b class="app-date" data-no-translate></b></div>
      <p class="mon-warn st-warn mb-out" hidden></p>
    </div>
  </header>
  <nav id="mainNav" aria-label="Report sections"><div class="tab-list" id="tabList"></div><span class="ink" id="ink"></span></nav>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="image-dialog" aria-labelledby="dialog-title">
  <div class="vw" id="vw"><img id="dialog-image" alt="" draggable="false"></div>
  <div class="vw-btns">
    <button class="cbtn" id="info-btn" type="button" aria-label="Information" aria-expanded="false" aria-controls="vw-sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.3" r="1.35" fill="currentColor" stroke="none"/><path d="M10.2 10.6L13 10.2L11.3 16.5C10.9 18 12.3 18.2 14.3 16.9" stroke-width="1.9"/></svg></button>
    <button class="cbtn" id="close-dialog" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="vw-sheet" id="vw-sheet"><h2 id="dialog-title" data-no-translate></h2><p class="quote" id="dialog-caption" data-no-translate></p><a class="link" id="dialog-original" target="_blank" rel="noopener">Open original saved screenshot ↗</a></div>
</dialog>
